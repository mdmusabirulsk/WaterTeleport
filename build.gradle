plugins {
	id 'fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'base'
}

version = project.mod_version
group = project.maven_group

allprojects {
	repositories {
		mavenCentral()
	}
}

// Build all version subprojects
tasks.register('buildAll') {
	group = 'build'
	description = 'Builds all supported Minecraft version modules and aggregates output artifacts.'
	dependsOn(subprojects.collect { "${it.path}:build" })
}

// Copy all version-specific subproject artifacts to root build/libs
tasks.register('copyArtifacts', Copy) {
	subprojects.each { subproject ->
		dependsOn "${subproject.path}:build"
		from(subproject.layout.buildDirectory.dir("libs")) {
			include "*.jar"
		}
	}
	into layout.buildDirectory.dir("libs")
}

buildAll.finalizedBy(copyArtifacts)
build.dependsOn(buildAll)
build.finalizedBy(copyArtifacts)
